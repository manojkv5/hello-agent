<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 { margin-bottom: 0.25rem; }
    p { color: #444; }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.1rem;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <h1>Hello, browser</h1>
  <p>This page is a simple check that Cursor can open and interact with a local HTML file.</p>
  <button id="test-btn" type="button">Click me</button>
  <p id="status">Waiting for a click…</p>
  <script>
    document.getElementById("test-btn").addEventListener("click", () => {
      document.getElementById("status").textContent =
        "Click received. Browser tools are working. Lets go";
    });
  </script>
</body>
</html>
